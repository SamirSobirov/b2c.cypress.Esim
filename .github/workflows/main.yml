name: B2C Authentication Monitoring

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
    inputs:
      user_chat_id:
        description: 'ID чата для личного ответа'
        required: false
        default: ''

jobs:
  cypress-run:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress run
        id: cypress
        timeout-minutes: 15
        uses: cypress-io/github-action@v6
        with:
          spec: cypress/e2e/monitoring/esim.cy.js
          browser: chrome
        env:
          CYPRESS_LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          CYPRESS_LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
        continue-on-error: true

      - name: Parse Diagnostic Data
        if: always()
        run: |
          # HTTP-коды и число офферов пишет сам тест:
          #   auth_api_status.txt — авторизация
          #   api_status.txt      — POST /api/v1/search/esim
          #   offers_count.txt    — сколько карточек нашлось на выдаче
          # tr -d убирает пробелы и перевод строки, которые добавляются в CI.
          read_file() {
            if [ -f "$1" ]; then cat "$1" | tr -d '[:space:]'; else echo "UNKNOWN"; fi
          }

          API_STATUS=$(read_file auth_api_status.txt)
          SEARCH_STATUS=$(read_file api_status.txt)
          OFFERS=$(read_file offers_count.txt)

          # Исход самого прогона Cypress: success / failure
          TEST_RESULT="${{ steps.cypress.outcome }}"

          echo "MSG_OFFERS=$OFFERS" >> $GITHUB_ENV

          if [[ ! "$API_STATUS" =~ ^[0-9]+$ ]]; then
            # До запроса авторизации не дошли: упал UI, не открылась модалка
            # или не заданы секреты LOGIN_EMAIL / LOGIN_PASSWORD
            echo "MSG_STATUS=🔴 UI Error / Crash" >> $GITHUB_ENV
            echo "MSG_CODE=N/A" >> $GITHUB_ENV
          elif [[ "$API_STATUS" -ge 400 ]]; then
            echo "MSG_STATUS=🆘 Auth Server Error" >> $GITHUB_ENV
            echo "MSG_CODE=auth HTTP $API_STATUS" >> $GITHUB_ENV
          elif [[ ! "$SEARCH_STATUS" =~ ^[0-9]+$ ]]; then
            # Вошли, но до запроса поиска не дошли: не открылась вкладка E-SIM,
            # не подставилась страна или не нажалась кнопка "Поиск"
            echo "MSG_STATUS=🔴 UI Error / Crash (E-SIM search)" >> $GITHUB_ENV
            echo "MSG_CODE=auth HTTP $API_STATUS / search N/A" >> $GITHUB_ENV
          elif [[ "$SEARCH_STATUS" -ge 400 ]]; then
            echo "MSG_STATUS=🆘 Search Server Error" >> $GITHUB_ENV
            echo "MSG_CODE=auth HTTP $API_STATUS / search HTTP $SEARCH_STATUS" >> $GITHUB_ENV
          elif [[ "$TEST_RESULT" == "success" ]]; then
            echo "MSG_STATUS=🟢 Success" >> $GITHUB_ENV
            echo "MSG_CODE=auth HTTP $API_STATUS / search HTTP $SEARCH_STATUS" >> $GITHUB_ENV
          else
            # Бэкенд ответил нормально, но UI-проверки не прошли
            echo "MSG_STATUS=🟡 UI Check Failed" >> $GITHUB_ENV
            echo "MSG_CODE=auth HTTP $API_STATUS / search HTTP $SEARCH_STATUS" >> $GITHUB_ENV
          fi

      - name: Upload Cypress Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          if-no-files-found: ignore

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: >-
            ${{ (github.event.inputs.user_chat_id != '') &&
            github.event.inputs.user_chat_id ||
            secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            ${{ github.event.inputs.user_chat_id != '' && '👤 **Manual Testing**' || '📢 **Hourly Monitoring**' }}

            🔐 **Module:** B2C Authentication + E-SIM Search (Турция)
            📊 **Status:** ${{ env.MSG_STATUS }}
            🌐 **Code:** ${{ env.MSG_CODE }}
            🎫 **Offers:** ${{ env.MSG_OFFERS }}